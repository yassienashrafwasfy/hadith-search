# Real client address when the site sits behind Cloudflare.
#
# Without this, every request reaches nginx from a Cloudflare edge address, so all visitors would
# share one sign-in limit, one search limit and one Grafana login limit, and the logs would name
# Cloudflare instead of the visitor.
#
# Cloudflare puts the visitor's address in CF-Connecting-IP. That header is believed ONLY when the
# request comes from a Cloudflare range below; from any other source it is ignored, so a client
# that reaches the origin directly cannot pick its own address to dodge the limits.
# real_ip_recursive stays off: only the header Cloudflare sets is read, never X-Forwarded-For.
#
# Ranges: https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6 (copied
# 2026-10-31; they change rarely). tests/security/test_edge.py pins this list to that copy.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
