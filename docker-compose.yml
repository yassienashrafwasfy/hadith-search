# Two copies of the app, blue and green, behind nginx. Start and switch them with
# tools/deploy.sh (see docs/HANDOFF.md item 21); the profiles keep each colour off until asked.
x-app: &app
  restart: unless-stopped
  # Caps for one app container. The defaults match the load tests in docs/HANDOFF.md (item 24).
  cpus: ${APP_CPUS:-2}
  mem_limit: ${APP_MEMORY:-4g}
  memswap_limit: ${APP_MEMORY:-4g}
  expose:
    - "8000"
  environment:
    # annotation = lightweight (no encoder/index preload), search = lazy Arabic encoder, research = eager
    # Set these in .env to change what the app serves. The defaults match the annotation preset.
    - APP_MODE=${APP_MODE:-annotation}
    - FEATURE_ANNOTATION=${FEATURE_ANNOTATION:-true}
    - FEATURE_BENCHMARK=${FEATURE_BENCHMARK:-false}
    - FEATURE_DENSE_RETRIEVAL=${FEATURE_DENSE_RETRIEVAL:-false}
    # prod: docs are hidden and the app refuses to start without CORS_ORIGINS and AUTH_SECRET
    - APP_ENV=prod
    # Comma-separated origins of the site, for example https://hadith.example. * is refused in prod.
    - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in .env to the site origin}
    # The password goes into a URL, so keep it to letters, digits, "-" and "_"
    - DATABASE_URL=postgresql+psycopg://hadith:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/hadith
    # Must be the same on both colours so a token from one is accepted by the other
    - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
    # Set by tools/deploy.sh from deploy/state/model.env (tools/promote_model.sh); empty means the
    # default model folder and the default hadith_embeddings table
    - ARABIC_MODEL_DIR=${ARABIC_MODEL_DIR:-}
    - EMBEDDINGS_RELEASE=${EMBEDDINGS_RELEASE:-}
    # One JSON object per log line, collected by Alloy into Loki (docs/HANDOFF.md item 47)
    - LOG_FORMAT=json
  volumes:
    # Query lists, qrels and evaluation outputs (the corpus, index and embeddings are in postgres)
    - hadith-data:/app/backend/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Not published: clients reach the app through the nginx service below.
  app-blue:
    <<: *app
    image: ${BLUE_IMAGE:-hadith-search:blue}
    container_name: hadith-blue
    profiles: ["blue"]

  app-green:
    <<: *app
    image: ${GREEN_IMAGE:-hadith-search:green}
    container_name: hadith-green
    profiles: ["green"]

  # Corpus, BM25 index, embeddings and annotation data. Not published to the host.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hadith-postgres
    environment:
      - POSTGRES_USER=hadith
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=hadith
    # Backups (docs/HANDOFF.md item 49): the db-backup service below streams the WAL through a
    # replication slot; the slot may hold back at most 2 GB of WAL if db-backup is down, so a
    # stopped backup service can never fill the disk. The hba file allows its replication login.
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - max_slot_wal_keep_size=2GB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/backup/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # restore-wal.sh is the restore_command that tools/db-restore.sh sets during a restore.
      - ./deploy/backup:/backup:ro
      # Read by tools/db-restore.sh (restore_command) when the database is restored.
      - postgres-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadith -d hadith"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Checked every second while it starts, so a restart or a restore (tools/db-restore.sh
      # waits for healthy) is noticed within a second instead of up to 5 (docs/HANDOFF.md item 49).
      start_period: 120s
      start_interval: 1s
    restart: unless-stopped

  # Continuous backups: WAL streamed as it is written plus a base backup every 6 hours, into the
  # postgres-backups volume (deploy/backup/backup-loop.sh). Restore with tools/db-restore.sh.
  # The volume is on this host: copy it elsewhere too, or losing the host loses the backups.
  db-backup:
    image: pgvector/pgvector:pg17
    container_name: hadith-db-backup
    entrypoint: ["/backup/backup-loop.sh"]
    environment:
      - PGHOST=postgres
      - PGUSER=hadith
      - PGPASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-21600}
      - BACKUP_KEEP=${BACKUP_KEEP:-3}
    volumes:
      - ./deploy/backup:/backup:ro
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Public edge: proxies to the app and rate-limits sign-in and sign-up (see nginx/default.conf).
  # The unprivileged image runs as a normal user and listens on 8080 inside the container.
  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: hadith-nginx
    ports:
      - "8000:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_app.conf:/etc/nginx/proxy_app.conf:ro
      # Which colour gets traffic; written by tools/deploy.sh (run `tools/deploy.sh init` first)
      - ./deploy/state:/etc/nginx/routing:ro
    restart: unless-stopped

  # --- Monitoring (docs/HANDOFF.md item 47) -------------------------------------------------------
  # Prometheus scrapes the app and the exporters below, evaluates monitoring/prometheus/alerts.yml
  # and hands firing alerts to Alertmanager, which e-mails them. Alloy ships container logs and
  # browser telemetry (Faro) to Loki. Grafana shows all of it under /grafana/ through nginx.
  # Nothing here is published to the host. Start with `docker compose up -d` (tools/deploy.sh
  # starts only postgres, nginx and the app). Missing settings stop only the container that needs
  # them, never an app deploy.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: hadith-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    mem_limit: 1g
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: hadith-alertmanager
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      # e.g. smtp.gmail.com:587 with a Gmail app password; see .env.example
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    mem_limit: 128m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    container_name: hadith-grafana
    # Refuse to start without a password: the image would otherwise fall back to admin/admin,
    # and Grafana is reachable through nginx.
    entrypoint: ["/bin/sh", "-c", 'test -n "$$GF_SECURITY_ADMIN_PASSWORD" || { echo "Set GRAFANA_ADMIN_PASSWORD in .env" >&2; exit 1; }; exec /run.sh']
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      # The public address of /grafana/, used for redirects and links in e-mails
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:8000/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # true when the site is served over HTTPS
      - GF_SECURITY_COOKIE_SECURE=${GRAFANA_COOKIE_SECURE:-false}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    container_name: hadith-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki
    mem_limit: 512m
    restart: unless-stopped

  # Reads container logs through the Docker socket (read-only mount, but the socket API itself is
  # powerful: keep this image pinned and trusted) and receives Faro telemetry from nginx.
  alloy:
    image: grafana/alloy:v1.21.2
    container_name: hadith-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 256m
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.0
    container_name: hadith-postgres-exporter
    environment:
      - DATA_SOURCE_URI=postgres:5432/hadith?sslmode=disable
      - DATA_SOURCE_USER=hadith
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    mem_limit: 64m
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: hadith-nginx-exporter
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    mem_limit: 32m
    restart: unless-stopped

  # Container CPU and memory against their limits. Needs privileged access to read cgroups.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: hadith-cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    mem_limit: 256m
    restart: unless-stopped

  # Host disk space (the root filesystem, mounted read-only).
  node-exporter:
    image: prom/node-exporter:v1.12.0
    container_name: hadith-node-exporter
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro
    mem_limit: 64m
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.29.0
    container_name: hadith-blackbox
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./monitoring/blackbox:/etc/blackbox:ro
    mem_limit: 64m
    restart: unless-stopped

volumes:
  hadith-data:
  postgres-data:
  postgres-backups:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  alloy-data:
