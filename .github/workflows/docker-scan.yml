name: docker-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New CVEs appear without code changes, so rescan weekly
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: hadolint
        run: docker run --rm -v "$PWD:/w" -w /w hadolint/hadolint:v2.14.0 hadolint Dockerfile
      - id: stamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          pull: true
          tags: hadith-search:hardened
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.stamp.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: trivy + dockle
        run: tools/scan-image.sh hadith-search:hardened
