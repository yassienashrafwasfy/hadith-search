services:
  hadith-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hadith-search
    # Not published: clients reach the app through the nginx service below.
    expose:
      - "8000"
    environment:
      # annotation = lightweight (no E5/index preload), search = lazy E5, research = eager E5
      - APP_MODE=annotation
      # Comma-separated origins, or * for all (disables credentials)
      - CORS_ORIGINS=*
      # Path to frontend build (defaults to ../static or ../frontend/dist)
      # - STATIC_DIR=/app/static
      # Jina API keys for cross-encoder reranking (search mode only)
      # - JINA_API_KEY=your_key_here
    volumes:
      # Mount the entire data directory as a persistent volume
      # Upload hadiths.db, queries.json, qrels_ungraded.json here
      # For search mode: also upload embeddings (.npy) and indexes (.pkl)
      - hadith-data:/app/backend/data
    restart: unless-stopped

  # Public edge: proxies to the app and rate-limits sign-in and sign-up (see nginx/default.conf).
  # The unprivileged image runs as a normal user and listens on 8080 inside the container.
  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: hadith-nginx
    ports:
      - "8000:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_app.conf:/etc/nginx/proxy_app.conf:ro
    depends_on:
      - hadith-search
    restart: unless-stopped

volumes:
  hadith-data:
