name: Release

# Pushing a version tag (v1.2.3) builds the image and publishes it to the private GitHub
# Container Registry package. Never runs for pull requests or forks. Pull it on the host with
# `tools/deploy.sh deploy --pull v1.2.3`.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image and delete old versions
      actions: read # look up the CI result for the tagged commit
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tag is on main and CI passed for that commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          [ "$passed" -ge 1 ] || { echo "::error::no successful CI run for $GITHUB_SHA"; exit 1; }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags are never overwritten
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$GITHUB_REF_NAME already exists; use a new version"; exit 1
          fi
      - id: stamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          pull: true
          # One manifest per tag: attestations would add untagged versions that count towards the
          # "keep the newest 3" below.
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: |
            REVISION=${{ github.ref_name }}
            CREATED=${{ steps.stamp.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Keep the newest 3 versions of the package
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
