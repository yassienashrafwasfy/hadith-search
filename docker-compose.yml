# Two copies of the app, blue and green, behind nginx. Start and switch them with
# tools/deploy.sh (see docs/HANDOFF.md item 21); the profiles keep each colour off until asked.
x-app: &app
  restart: unless-stopped
  # Caps for one app container. The defaults match the load tests in docs/HANDOFF.md (item 24).
  cpus: ${APP_CPUS:-2}
  mem_limit: ${APP_MEMORY:-4g}
  memswap_limit: ${APP_MEMORY:-4g}
  expose:
    - "8000"
  environment:
    # annotation = lightweight (no encoder/index preload), search = lazy Arabic encoder, research = eager
    # Set these in .env to change what the app serves. The defaults match the annotation preset.
    - APP_MODE=${APP_MODE:-annotation}
    - FEATURE_ANNOTATION=${FEATURE_ANNOTATION:-true}
    - FEATURE_BENCHMARK=${FEATURE_BENCHMARK:-false}
    - FEATURE_DENSE_RETRIEVAL=${FEATURE_DENSE_RETRIEVAL:-false}
    # prod: docs are hidden and the app refuses to start without CORS_ORIGINS and AUTH_SECRET
    - APP_ENV=prod
    # Comma-separated origins of the site, for example https://hadith.example. * is refused in prod.
    - CORS_ORIGINS=${CORS_ORIGINS:?Set CORS_ORIGINS in .env to the site origin}
    # The password goes into a URL, so keep it to letters, digits, "-" and "_"
    - DATABASE_URL=postgresql+psycopg://hadith:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/hadith
    # Must be the same on both colours so a token from one is accepted by the other
    - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env}
    # Set by tools/deploy.sh from deploy/state/model.env (tools/promote_model.sh); empty means the
    # default model folder and the default hadith_embeddings table
    - ARABIC_MODEL_DIR=${ARABIC_MODEL_DIR:-}
    - EMBEDDINGS_RELEASE=${EMBEDDINGS_RELEASE:-}
  volumes:
    # Query lists, qrels and evaluation outputs (the corpus, index and embeddings are in postgres)
    - hadith-data:/app/backend/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Not published: clients reach the app through the nginx service below.
  app-blue:
    <<: *app
    image: ${BLUE_IMAGE:-hadith-search:blue}
    container_name: hadith-blue
    profiles: ["blue"]

  app-green:
    <<: *app
    image: ${GREEN_IMAGE:-hadith-search:green}
    container_name: hadith-green
    profiles: ["green"]

  # Corpus, BM25 index, embeddings and annotation data. Not published to the host.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hadith-postgres
    environment:
      - POSTGRES_USER=hadith
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=hadith
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadith -d hadith"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Public edge: proxies to the app and rate-limits sign-in and sign-up (see nginx/default.conf).
  # The unprivileged image runs as a normal user and listens on 8080 inside the container.
  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: hadith-nginx
    ports:
      - "8000:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_app.conf:/etc/nginx/proxy_app.conf:ro
      # Which colour gets traffic; written by tools/deploy.sh (run `tools/deploy.sh init` first)
      - ./deploy/state:/etc/nginx/routing:ro
    restart: unless-stopped

volumes:
  hadith-data:
  postgres-data:
