# Public edge for the app: proxies everything to uvicorn and rate-limits sign-in and sign-up.
# Loaded into the http block of the nginx-unprivileged image (listens on 8080 inside).

# One counter per client address. nginx refills one try per minute (its slowest unit), and
# burst=4 on top of the first request allows 5 tries at once. So: 5 quick tries, then one
# more each minute, at most 65 in the first hour. About 10 MB holds 160k addresses.
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/m;

server_tokens off;

# Docker's built-in DNS. The app name is looked up per request (see proxy_app.conf), so nginx
# starts even if the app is not up yet and follows it when its container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Bodies here are small JSON; anything bigger is not a legitimate request.
    client_max_body_size 1m;

    # Same error shape as the API (RFC 9457) when a limit is hit.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many sign-in or sign-up attempts. Try again in a minute."}';
    }

    # Sign-in and sign-up: the only rate-limited routes.
    location = /api/v1/tokens {
        limit_req zone=auth burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_app.conf;
    }
    location = /api/v1/annotators {
        limit_req zone=auth burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_app.conf;
    }

    location / {
        include /etc/nginx/proxy_app.conf;
    }
}
