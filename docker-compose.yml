services:
  hadith-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hadith-search
    # Not published: clients reach the app through the nginx service below.
    expose:
      - "8000"
    environment:
      # annotation = lightweight (no E5/index preload), search = lazy E5, research = eager E5
      - APP_MODE=annotation
      # Comma-separated origins, or * for all (disables credentials)
      - CORS_ORIGINS=*
      # The password goes into a URL, so keep it to letters, digits, "-" and "_"
      - DATABASE_URL=postgresql+psycopg://hadith:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/hadith
      # Path to frontend build (defaults to ../static or ../frontend/dist)
      # - STATIC_DIR=/app/static
      # Jina API keys for cross-encoder reranking (search mode only)
      # - JINA_API_KEY=your_key_here
    volumes:
      # Query lists, qrels and evaluation outputs (the corpus, index and embeddings are in postgres)
      - hadith-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Corpus, BM25 index, embeddings and annotation data. Not published to the host.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: hadith-postgres
    environment:
      - POSTGRES_USER=hadith
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=hadith
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadith -d hadith"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Public edge: proxies to the app and rate-limits sign-in and sign-up (see nginx/default.conf).
  # The unprivileged image runs as a normal user and listens on 8080 inside the container.
  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    container_name: hadith-nginx
    ports:
      - "8000:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_app.conf:/etc/nginx/proxy_app.conf:ro
    depends_on:
      - hadith-search
    restart: unless-stopped

volumes:
  hadith-data:
  postgres-data:
