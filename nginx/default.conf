# Public edge for the app: proxies everything to uvicorn and rate-limits sign-in and sign-up.
# Loaded into the http block of the nginx-unprivileged image (listens on 8080 inside).

# One counter per client address. nginx refills one try per minute (its slowest unit), and
# burst=4 on top of the first request allows 5 tries at once. So: 5 quick tries, then one
# more each minute, at most 65 in the first hour. About 10 MB holds 160k addresses.
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/m;

# Search spikes, per client address. Requests over 10 a second are not refused at once: up to 20
# of them wait in line and are let through at 10 a second (the first 10 of a burst go straight
# through). Past that, and past 8 searches in flight from one address, the answer is 503 with
# Retry-After. The limit shared by all clients is the queue in the app (backend/limiter.py).
limit_req_zone $binary_remote_addr zone=search:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=search_conn:10m;

server_tokens off;

# Sets $app_backend and $release_colour: which colour gets each request. Written by tools/deploy.sh.
include /etc/nginx/routing/routing.conf;

# Docker's built-in DNS. The app names are looked up per request (see proxy_app.conf), so nginx
# starts even if a colour is not up and follows it when its container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    # Bodies here are small JSON; anything bigger is not a legitimate request.
    client_max_body_size 1m;

    # Same error shape as the API (RFC 9457) when a limit is hit.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/problem+json;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many sign-in or sign-up attempts. Try again in a minute."}';
    }

    # Busy: same error shape as the API. The app's own 503 (queue full) already has this shape.
    error_page 503 = @busy;
    location @busy {
        default_type application/problem+json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The server is busy. Try again in a moment."}';
    }

    # Search: smoothed per client, then queued in the app.
    location = /api/v1/searches {
        limit_req zone=search burst=20 delay=10;
        limit_req_status 503;
        limit_conn search_conn 8;
        limit_conn_status 503;
        include /etc/nginx/proxy_app.conf;
    }

    # Sign-in and sign-up: rate-limited with a hard 429 and no waiting.
    location = /api/v1/tokens {
        limit_req zone=auth burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_app.conf;
    }
    location = /api/v1/annotators {
        limit_req zone=auth burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_app.conf;
    }

    location / {
        include /etc/nginx/proxy_app.conf;
    }
}
