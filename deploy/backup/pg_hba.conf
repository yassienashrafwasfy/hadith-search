# Client authentication for the postgres service (docs/HANDOFF.md item 49). Mounted read-only
# and named by `-c hba_file=...` in docker-compose.yml, so it applies to an existing database as
# well (the image writes its own pg_hba.conf only when it creates a new one).
#
# The first seven lines are what the image writes. The last one lets the db-backup service
# stream WAL and take base backups (replication connections) with the same password.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
